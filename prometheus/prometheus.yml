global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus-container:9090"]

  - job_name: redis_exporter
    static_configs:
      - targets: [":9121"]

  - job_name: rabbitmq
    static_configs:
      - targets: [":15692"]

  - job_name: aws_spring
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: [":8080"]
