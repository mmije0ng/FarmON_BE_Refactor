version: "3.9"

services:
  redis:
    volumes:
      - ./redis/data:/data
      - ./config/local/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes"]

  rabbitmq:
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  mysql:
    container_name: mysql-container
    image: mysql:8.0
    ports:
      - "3307:3306"
    networks:
      - app-network
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./config/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  prometheus:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

  grafana:
    volumes:
      - ./grafana:/var/lib/grafana

  nginx:
    volumes:
      - ./config/local/nginx.conf:/etc/nginx/nginx.conf:ro

  # k6 (로컬에서 AWS 서버 부하 테스트)
  k6:
    container_name: k6
    image: grafana/k6:latest
    networks:
      - app-network
    depends_on:
      - prometheus
    environment:
      # Prometheus Remote Write 설정
      K6_OUT: "experimental-prometheus-rw"
      K6_PROMETHEUS_RW_SERVER_URL: "http://prometheus-container:9090/api/v1/write"
      K6_PROMETHEUS_RW_TREND_STATS: "p(90),p(95),p(99),avg,max"
      # 테스트 스크립트에서 사용할 변수
      TARGET_BASE_URL: "http://${TARGET_BASE_URL:-localhost}:8080"
    volumes:
      # [호스트 경로] : [컨테이너 내부 경로]
      - ./k6:/scripts:ro
    entrypoint: [ "k6", "run" ]
