# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: assertive

  high_level_summary: true
  high_level_summary_instructions: |
    PR 변경 사항을 한국어로 간결하게 요약해 주세요.
    성능, 구조, 안정성 관점의 핵심 변경점을 중심으로 설명해 주세요.

  path_instructions:
    - path: "**/*.java"
      instructions: |
        아래 기준에 따라 Java 코드를 줄 단위로 상세히 리뷰해 주세요.
        문제가 있는 코드 라인에는 직접 코멘트를 남겨 주세요.

        1. 예외 처리
           - @ControllerAdvice / @ExceptionHandler 사용 여부
           - RuntimeException 남용 여부
           - 로그에 민감 정보 노출 여부

        2. 코드 품질 & 구조
           - 단일 책임 원칙(SRP) 위반
           - 중복 코드
           - DTO ↔ Entity 변환 책임 위치
           - Service 계층 비대화 여부

        3. Spring Web & REST API
           - HTTP 상태 코드 적절성
           - 컨트롤러 비즈니스 로직 포함 여부

        4. JPA & Query 성능
           - EAGER 로딩 남용
           - N+1 문제 가능성
           - fetch join / batch size 개선 포인트

        5. 트랜잭션
           - @Transactional 위치
           - readOnly 적용 여부
           - 트랜잭션 범위 적절성

        6. 보안
           - 민감 정보 로그 출력 여부
           - @Valid / Bean Validation 사용 여부
           - 인증/인가 우회 가능성

  auto_review:
    enabled: true
    drafts: true

  request_changes_workflow: true
  auto_apply_labels: true
  auto_assign_reviewers: true
  fail_commit_status: true
